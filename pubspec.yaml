name: law_office
description: "نظام إدارة مكتب المحاماة - النسخة السورية / دمشق - تطبيق أندرويد للمحامي"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.0

  # Database & ORM
  drift: ^2.24.2
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1

  # Security & Authentication
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  shared_preferences: ^2.3.5

  # Storage & Files
  file_picker: ^8.1.7
  open_filex: ^4.5.0
  share_plus: ^10.1.4

  # Encryption & Archive (Full Backups)
  archive: ^3.6.1
  crypto: ^3.0.6
  cryptography: ^2.7.0

  # Cloud Backup (Google Drive)
  google_sign_in: ^6.2.2
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  http: ^1.3.0

  # Notifications & Scheduling
  flutter_local_notifications: ^18.0.1

  # Speech to Text
  speech_to_text: 7.0.0

  # UI, Fonts & Localization
  intl: ^0.20.2
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # Reports & Exporting
  csv: ^6.0.0
  excel: ^4.0.6
  pdf: ^3.11.1
  printing: ^5.13.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.24.2
  build_runner: ^2.4.15

dependency_overrides:
  path_provider_foundation: 2.3.2

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
